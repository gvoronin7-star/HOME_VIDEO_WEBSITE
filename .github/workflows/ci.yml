name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — types, build, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # ffmpeg brings ffprobe, which the narration step uses to measure how long
      # each spoken line lasts. Without it the tests still pass via the estimate
      # path, but installing it exercises the real one.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: npm ci

      - name: Type-check sources
        run: npm run typecheck

      - name: Type-check tests
        run: npm run typecheck:tests

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test
        env:
          # Startup-guard tests launch the compiled server; keep its logs readable.
          LOG_LEVEL: info

  frontend:
    name: Frontend — types and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  images:
    name: Docker images build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # This job exists because of a real incident: `.dockerignore` excluded the
      # frontend `src` directory, so the image could not be built at all while
      # every local command still worked. Nothing else in CI would have caught it.
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: family-cinema-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: family-cinema-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate compose file
        run: docker compose config --quiet
        env:
          JWT_SECRET: ci-placeholder-secret-not-used-at-runtime

  smoke:
    name: Compose smoke test
    runs-on: ubuntu-latest
    needs: images

    steps:
      - uses: actions/checkout@v4

      # Brings the whole stack up the way a deployment does and checks the two
      # things that were silently broken before: that the schema and reference
      # data are created, and that a story can actually be created.
      - name: Start the stack
        run: docker compose up -d --build
        env:
          NODE_ENV: production
          JWT_SECRET: ci-only-secret-Q7pX2vZ9mK4rT8wY6nB3jL5hF1dS0aG
          PUBLIC_URL: http://localhost:3000

      - name: Wait for the API to report healthy
        run: |
          for attempt in $(seq 1 40); do
            body=$(curl -fsS http://localhost:4000/api/health || true)
            echo "$body"
            if echo "$body" | grep -q '"database":"ok"'; then
              echo "API is up"
              exit 0
            fi
            sleep 5
          done
          echo "API did not become healthy in time"
          docker compose logs --no-color
          exit 1

      - name: Reference data must be seeded (B3)
        run: |
          templates=$(curl -fsS http://localhost:4000/api/templates)
          echo "$templates"
          # An empty list makes story creation impossible: a template is required.
          echo "$templates" | grep -q '"templates":\[{' || {
            echo "Templates are empty — the init step did not run"
            docker compose logs --no-color init
            exit 1
          }

      - name: Frontend must serve the SPA
        run: curl -fsS http://localhost:3000 | grep -qi '<div id="root"'

      # The pipeline's whole point, and the one thing no unit test can establish:
      # that FFmpeg accepts the arguments we build and produces a playable file.
      # Everything about the render was previously verified by inspecting argv,
      # which says nothing about whether the real binary agrees — the drawtext
      # textfile form, the concat demuxer, font resolution and the audio mux are
      # only exercised here.
      - name: Render a video end to end
        run: |
          set -uo pipefail
          API=http://localhost:4000

          # Demo fixtures give real sharp-generated photos and written captions, so
          # this step exercises the pipeline instead of preparing data.
          docker compose exec -T backend node dist/utils/demoSeed.js || {
            echo "::error::demo seeding failed"
            exit 1
          }

          token=$(curl -fsS -X POST "$API/api/auth/login" \
            -H 'Content-Type: application/json' \
            -d '{"email":"demo@family-cinema.local","password":"demo1234"}' \
            | jq -er '.data.token') || {
            echo "::error::could not sign in as the demo user"
            exit 1
          }

          story=$(curl -fsS "$API/api/stories" -H "Authorization: Bearer $token" \
            | jq -er '.data.stories[0].id') || {
            echo "::error::demo user has no stories"
            exit 1
          }
          echo "story under test: $story"

          # Check the enqueue explicitly. A 503 here means Redis is unreachable, and
          # without this the polling loop below would spin for five minutes and then
          # report a timeout, hiding the real cause.
          code=$(curl -sS -o /tmp/generate.json -w '%{http_code}' \
            -X POST "$API/api/stories/$story/generate" \
            -H "Authorization: Bearer $token")
          cat /tmp/generate.json
          if [ "$code" != "200" ]; then
            echo "::error::generate returned HTTP $code: $(jq -r '.error.message // "no message"' /tmp/generate.json)"
            exit 1
          fi

          # 1080p slides on a shared runner are not fast; allow five minutes.
          status=unknown
          for attempt in $(seq 1 60); do
            body=$(curl -fsS "$API/api/stories/$story/status" -H "Authorization: Bearer $token" || true)
            status=$(jq -r '.data.story.status // "unknown"' <<<"$body")
            progress=$(jq -r '.data.task.progress // 0' <<<"$body")
            echo "  [$attempt] status=$status progress=$progress%"

            if [ "$status" = "ready" ]; then
              break
            fi
            if [ "$status" = "error" ]; then
              echo "::error::generation failed: $(jq -r '.data.task.errorMessage // "no message"' <<<"$body")"
              exit 1
            fi
            sleep 5
          done

          if [ "$status" != "ready" ]; then
            echo "::error::generation did not finish in time (last status: $status)"
            exit 1
          fi

          # ffprobe runs inside the image, against the file the worker just wrote.
          probe=$(docker compose exec -T backend ffprobe -v error \
            -show_entries 'format=duration:stream=codec_type,codec_name,width,height' \
            -of json "/app/uploads/videos/story-$story.mp4")
          echo "$probe"

          duration=$(jq -r '.format.duration' <<<"$probe")
          awk -v d="$duration" 'BEGIN { exit (d > 1) ? 0 : 1 }' || {
            echo "::error::rendered video is only ${duration}s long"
            exit 1
          }

          jq -e '[.streams[] | select(.codec_type=="video" and .codec_name=="h264"
                 and .width==1920 and .height==1080)] | length == 1' <<<"$probe" >/dev/null || {
            echo "::error::expected exactly one 1920x1080 h264 video stream"
            exit 1
          }

          # A silent track still proves the audio mux path ran; narration itself
          # needs a key and is checked by hand.
          jq -e '[.streams[] | select(.codec_type=="audio")] | length >= 1' <<<"$probe" >/dev/null || {
            echo "::error::rendered video has no audio stream"
            exit 1
          }

          # Exports and the public page are part of the same promise.
          detail=$(curl -fsS "$API/api/stories/$story" -H "Authorization: Bearer $token")
          for field in pdfUrl qrCodeUrl; do
            url=$(jq -er ".data.story.$field" <<<"$detail")
            curl -fsS -o /dev/null "$API$url" || {
              echo "::error::$field is not reachable at $url"
              exit 1
            }
          done

          curl -fsS "$API/api/share/$story" | jq -e '.data.story.videoUrl' >/dev/null || {
            echo "::error::public share page does not expose the video"
            exit 1
          }

          echo "rendered ${duration}s of 1080p video, exports and share page all reachable"

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
